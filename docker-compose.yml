version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: academia-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: academia-db
    ports:
      - '5434:5432'
    volumes:
      - academia-postgres-data:/var/lib/postgresql/data

volumes:
  academia-postgres-data: